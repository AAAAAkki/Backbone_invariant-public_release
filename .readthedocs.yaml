# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details.

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.10"

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: false

# Install the package (pulls in runtime deps from requirements.txt via
# pyproject.toml's dynamic dependencies) plus the [dev] extras, which
# provide sphinx and sphinx-mdinclude needed to build the docs.
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - dev
